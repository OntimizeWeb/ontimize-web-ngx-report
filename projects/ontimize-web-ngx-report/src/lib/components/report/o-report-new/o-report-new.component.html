<o-form #form service="reportstore" entity="report" keys="REPORTID" header-actions="R;I;U;D" show-header-navigation="no"
  [configure-service-args]="configureServiceReportStore()">
  <div o-form-toolbar-buttons>
    <button type="button" class="o-form-toolbar-button" mat-stroked-button (click)="onClickSave($event)" attr="fillreport">
      <mat-icon>save</mat-icon>
      <span>{{ 'SAVE'| oTranslate}}</span>
    </button>
  </div>
  <o-column attr="row1" title="REPORT_DATA" icon="description" layout-gap="14px" class="o-flex-fill">
    <div class="o-flex-row-wrap o-layout-align-start-start o-flex" style="gap:14px">
      <o-text-input #name class="input-padding o-flex-50" attr="REPORTNAME" label="REPORT_NAME" required="yes"></o-text-input>
      <o-text-input #type class="input-padding o-flex" attr="REPORTTYPE" label="REPORT_TYPE" required="yes"></o-text-input>
    </div>
    <o-textarea-input #description attr="REPORTDESCRIPTION" label="REPORT_DESCRIPTION" class="o-flex" required="yes"></o-textarea-input>
    <o-file-input #file attr="file" class="o-flex-50" service="reportstore" entity="report" label="REPORT_ZIPFOLDER" show-info="yes" workspace-key="id"
      required="yes" (onUploadFile)="onUploadFile()" accept-file-type=".zip" [additional-data]="getFileData()" (onErrorFile)="onError()"
      [configure-service-args]="configureServiceReportStore()">
    </o-file-input>
  </o-column>
</o-form>
@if (loading) {
<div class="loading">
  <div class="spinner">
    <mat-spinner mode="indeterminate"></mat-spinner>
  </div>
</div>
}
