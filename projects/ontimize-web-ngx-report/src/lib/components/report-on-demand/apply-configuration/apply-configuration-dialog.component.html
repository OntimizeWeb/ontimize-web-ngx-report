<span mat-dialog-title>{{ 'TABLE.BUTTONS.APPLY_CONFIGURATION' | oTranslate }}</span>
<mat-dialog-content class="o-flex-column">
  <div mat-subheader>{{ 'TABLE.DIALOG.APPLY_CONFIGURATION' | oTranslate }}</div>
  <mat-selection-list #configurationList dense class="apply-configuration-dialog-list">
    @for (configuration of configurationListData; track configuration) {
      <mat-list-option (click)="onClickConfigurationList(configuration)" checkboxPosition="before"
        [value]="configuration">
        <span matListItemTitle>{{ configuration.PREFERENCENAME }}</span>
        <span matListItemLine>{{ configuration.PREFERENCEDESCRIPTION }}</span>
      </mat-list-option>
    }
  </mat-selection-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" (click)="remove()" mat-stroked-button [disabled]="configurationList.selectedOptions.selected.length!==1"
    class="o-button-danger">
    {{ 'DELETE' | oTranslate }}
  </button>
  <span class="o-flex"></span>
  <button type="button" mat-stroked-button [mat-dialog-close]="false" class="o-button-default">{{ 'CANCEL' | oTranslate }}</button>
  <button type="button" (click)="loadConfiguration()" mat-stroked-button [mat-dialog-close]="true"
    [disabled]="configurationList.selectedOptions.selected.length!==1" class="o-button-primary">{{ 'OK' | oTranslate}}</button>
</mat-dialog-actions>
