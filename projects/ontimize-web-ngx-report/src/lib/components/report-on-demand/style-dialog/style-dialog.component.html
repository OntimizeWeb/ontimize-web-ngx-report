<span mat-dialog-title>{{ 'COLUMN_CONFIGURATION' | oTranslate }}</span>
<mat-dialog-content>
  <div mat-subheader>{{ 'SAVE_COLUMN_CONFIGURATION' | oTranslate }}</div>
  <div class="o-flex-column o-layout-align-start-start o-gap-12">
    <form #form>
      <mat-form-field subscriptSizing='dynamic' class="o-flex-fill">
        <mat-label>{{ 'COLUMN_NAME' | oTranslate }}</mat-label>
        <input id="columnNameInput" name="columnNameInput" matInput placeholder="{{ 'COLUMN_NAME' | oTranslate }}"
               required [(ngModel)]="reportColumn.name" #columnNameInput="ngModel"
               [ngModelOptions]="{standalone: true}">
      </mat-form-field>
      <mat-form-field subscriptSizing='dynamic' class="o-flex-fill">
        <input id="widthColumnInput" name="widthColumnInput" matInput type="number"
               placeholder="{{ 'COLUMN_WIDTH' | oTranslate }}" required [(ngModel)]="reportColumn.columnStyle.width"
               #widthColumnInput="ngModel" [ngModelOptions]="{standalone: true}">
        <span matSuffix>px</span>
        <mat-hint></mat-hint>
      </mat-form-field>
      <mat-radio-group [(ngModel)]="reportColumn.columnStyle.alignment" class="o-flex-fill o-layout-align-sb-center"
                       [ngModelOptions]="{standalone: true}">
        @for (aligmentItem of dataAlignment; track aligmentItem.name) {
        <mat-radio-button [value]="aligmentItem.name"
                          [checked]="reportColumn.columnStyle.alignment === aligmentItem.name">
          <mat-icon class="o-flex">
            {{ aligmentItem.icon }}
          </mat-icon>
        </mat-radio-button>
        }
      </mat-radio-group>
    </form>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" mat-stroked-button class="mat-primary" [mat-dialog-close]="false" class="o-button-default">
    {{ 'CANCEL' | oTranslate }}</button>
  <button type="button" mat-stroked-button class="mat-primary" (click)="confirm()" [mat-dialog-close]="true"
          [disabled]="columnNameInput.invalid || widthColumnInput.invalid">
    {{ 'SAVE' | oTranslate }}</button>
</mat-dialog-actions>
